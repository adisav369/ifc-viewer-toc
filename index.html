<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>IFC Viewer</title>
  <style>
    html, body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
    #container { width: 100vw; height: 100vh; }

    #upload-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #202932;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    #upload-btn {
      padding: 14px 28px;
      font-size: 16px;
      background: #494cb6;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    #upload-status {
      color: white;
      margin-top: 16px;
      font-size: 14px;
    }
    #graph-explorer {
      position: fixed;
      top: 130px; right: 0;
      width: 280px; height: calc(100vh - 130px);
      background: rgba(20, 26, 33, 0.95);
      color: #e0e0e0;
      padding: 16px;
      box-sizing: border-box;
      font-size: 13px;
      overflow-y: auto;
      display: none;
      z-index: 5;
    }
    #graph-explorer h3 {
      margin: 12px 0 4px;
      color: #bcf124;
      font-size: 12px;
      text-transform: uppercase;
      border-bottom: 1px solid #444;
      padding-bottom: 4px;
    }
    #graph-explorer .row { margin: 3px 0; }
    #graph-explorer .label { color: #888; }

    #search-panel {
  position: fixed;
  top: 0; right: 0;
  width: 280px;
  background: rgba(20, 26, 33, 0.98);
  padding: 12px 16px;
  box-sizing: border-box;
  z-index: 6;
  display: none;
  border-bottom: 1px solid #444;
}
#search-input {
  width: 100%;
  padding: 8px;
  background: #1a1f27;
  border: 1px solid #444;
  color: #e0e0e0;
  border-radius: 4px;
  box-sizing: border-box;
  font-size: 13px;
}
#search-results {
  margin-top: 8px;
  max-height: 240px;
  overflow-y: auto;
}
.search-result-item {
  padding: 6px 4px;
  cursor: pointer;
  border-bottom: 1px solid #2a2f38;
  font-size: 12px;
}
.search-result-item:hover {
  background: rgba(188, 241, 36, 0.1);
}
.search-result-name { color: #e0e0e0; font-weight: 600; }
.search-result-meta { color: #888; font-size: 11px; }
  </style>

</head>
<body>
  <div id="search-panel">
    <input type="text" id="search-input" placeholder="Ask EIF... e.g. show walls, walls on level 3" />
    <div id="search-results"></div>
  </div>
  <button id="pdf-upload-btn" style="position: fixed; top: 16px; left: 16px; z-index: 6; display: none; padding: 8px 14px; background: #494cb6; color: white; border: none; border-radius: 6px; cursor: pointer;">
    Upload Spec PDF
  </button>
<input type="file" id="pdf-input" accept=".pdf" style="display: none;" />
  <div id="container"></div>

  <div id="graph-explorer">
    <h3>Selected Element</h3>
    <div id="ge-element"></div>
    <h3>Graph Relationships</h3>
    <div id="ge-relationships"></div>
  </div>

  <div id="upload-screen">
    <button id="upload-btn">Upload IFC Model</button>
    <input type="file" id="file-input" accept=".ifc" style="display: none;" />
    <div id="upload-status"></div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
